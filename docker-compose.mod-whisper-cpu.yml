services:
  stt-vault:
    depends_on:
      mod-whisper-cpu:
        condition: service_healthy
    environment:
      STT_TRANSCRIPTION_PROVIDER: mod-whisper-cpu
      STT_DIARIZATION_PROVIDER: senko
      STT_MOD_WHISPER_CPU_DIGEST: ${STT_MOD_WHISPER_CPU_DIGEST:?}
    networks:
      - default
      - stt-mods
    secrets:
      - source: stt_mod_token
        uid: "0"
        gid: "0"
        mode: 0400

  mod-whisper-cpu:
    image: ${STT_MOD_WHISPER_CPU_IMAGE:?}@${STT_MOD_WHISPER_CPU_DIGEST:?}
    user: "10001:10001"
    read_only: true
    profiles:
      - mod-whisper-cpu
    environment:
      WHISPER_MODEL_ID: ${STT_MOD_WHISPER_CPU_MODEL:-ggml-base.en.bin}
      WHISPER_IMAGE_DIGEST: ${STT_MOD_WHISPER_CPU_DIGEST:?}
    secrets:
      - source: stt_mod_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - stt-mods
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=1777
